name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Resolves to the previous commit SHA or the PR target base SHA
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      - name: Scan Results Status 
        if: steps.trufflehog.outcome == 'failure' 
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q user_created_solutions/

      - name: Run bandit (SAST)
        run: bandit -r user_created_solutions/ -x '**/*_test.py'

      - name: Run ruff
        run: ruff check user_created_solutions/

      - name: Run ruff format check
        run: ruff format --check user_created_solutions/
